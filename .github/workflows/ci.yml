name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        # Windows es donde se usa el programa; Linux, donde se desarrolla.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bibliotecas de sistema para Qt (solo Linux)
        if: runner.os == 'Linux'
        # Con reintentos: el 11-11-2026 los servidores de GitHub estuvieron más de 20 min
        # sin resolver los repositorios de Ubuntu y la prueba caía antes de empezar.
        run: |
          for intento in 1 2 3 4 5; do
            sudo apt-get update -q && sudo apt-get install -y -q -o Acquire::Retries=3 \
              libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 && exit 0
            echo "Intento $intento sin red hacia los repositorios de Ubuntu; otro en 60 s."
            sleep 60
          done
          exit 1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python -m pytest
