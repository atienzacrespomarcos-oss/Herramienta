name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        # Windows es donde se usa el programa; Linux, donde se desarrolla.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bibliotecas de sistema para Qt (solo Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python -m pytest
