name: Ejecutable Windows

# Genera TRAZA.exe y lo deja como artefacto descargable de la ejecución
# (pestaña Actions → ejecución → «TRAZA-windows»). Antes de publicarlo, el propio
# ejecutable pasa su autoprueba: un .exe que compila pero no funciona no se publica.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Construir TRAZA.exe
        run: >
          uv run pyinstaller --noconfirm --clean --windowed --name TRAZA
          --collect-data pint --collect-data docx scripts/traza_exe.py
      - name: Autoprueba del ejecutable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $informe = Join-Path $env:RUNNER_TEMP "autoprueba.txt"
          $p = Start-Process -FilePath dist\TRAZA\TRAZA.exe -ArgumentList "--autoprueba","--informe","`"$informe`"" -Wait -PassThru
          if (Test-Path $informe) { Get-Content $informe -Encoding utf8 } else { Write-Output "(sin informe)" }
          if ($p.ExitCode -ne 0) { throw "La autoprueba del ejecutable ha fallado (código $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: TRAZA-windows
          path: dist/TRAZA
          retention-days: 30
