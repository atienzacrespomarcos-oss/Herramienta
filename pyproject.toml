[project]
name = "traza"
version = "0.1.0"
description = "Entorno personal de ingeniería de instalaciones para naves industriales"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8",
    "pint>=0.24",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
    "ezdxf>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "import-linter>=2.1",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ui: pruebas de interfaz (necesitan Qt; se ejecutan sin pantalla)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# Reglas de dependencia entre capas (docs/TECHNICAL_SPECIFICATION.md §6.1).
# Si un contrato falla, NO se relaja: se mueve el código a la capa correcta.
[tool.importlinter]
root_package = "traza"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Los motores y la normativa son puros: sin interfaz, sin base de datos, sin IA"
type = "forbidden"
source_modules = ["traza.engines", "traza.rules"]
forbidden_modules = ["traza.ui", "traza.persistence", "traza.app", "traza.ai", "PySide6", "sqlite3"]

[[tool.importlinter.contracts]]
name = "El modelo de dominio no depende de nada externo al núcleo"
type = "forbidden"
source_modules = ["traza.core"]
forbidden_modules = ["traza.ui", "traza.persistence", "traza.app", "traza.ai", "traza.io", "PySide6", "sqlite3"]

[[tool.importlinter.contracts]]
name = "La interfaz no toca la base de datos: solo la capa de aplicación"
# Directo prohibido; a través de traza.app (que sí usa la base de datos) permitido.
allow_indirect_imports = true
type = "forbidden"
source_modules = ["traza.ui"]
forbidden_modules = ["traza.persistence", "sqlite3"]

[[tool.importlinter.contracts]]
name = "La IA solo propone órdenes: no accede a la base de datos"
# Directo prohibido; a través de traza.app (que sí usa la base de datos) permitido.
allow_indirect_imports = true
type = "forbidden"
source_modules = ["traza.ai"]
forbidden_modules = ["traza.persistence", "sqlite3", "traza.ui"]

[tool.ruff.lint.per-file-ignores]
# Los registros BC3 de prueba se escriben en una línea, como en un fichero real.
"tests/unit/test_bc3.py" = ["E501"]
"tests/unit/test_bc3_escritura.py" = ["E501"]
"tests/integration/test_modificados.py" = ["E501"]
"tests/integration/test_modificado_bc3.py" = ["E501"]
"tests/ui/test_ventana.py" = ["E501"]
"tests/integration/test_planos.py" = ["E501"]
